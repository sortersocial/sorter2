name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust tests
        run: cargo test --all

      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: "1.12.0.1530"

      - name: Install Playwright browser (spel browser tests)
        run: clojure -M -e "(com.microsoft.playwright.CLI/main (into-array String [\"install\" \"chromium\" \"--with-deps\"]))"

      - name: Clojure tests (Kaocha)
        run: |
          mkdir -p target
          clojure -M:kaocha
