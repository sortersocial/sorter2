app = "sorter2"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SORTER2_DATA_DIR = "/data"
  SORTER2_EVENT_LOG = "/data/events.jsonl"
  PORT = "8080"

[vm]
  memory = "256mb"
  cpus = 1

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 100

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[mounts]]
  source = "sorter2_data"
  destination = "/data"
